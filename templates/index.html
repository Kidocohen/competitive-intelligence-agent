<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Competitive Intelligence Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 24px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            margin-top: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .output-box {
            margin-top: 30px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            min-height: 120px;
            white-space: pre-wrap;
            font-family: inherit;
            line-height: 1.6;
            color: #e2e8f0;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-safe { background-color: #065f46; color: #34d399; }
        .badge-blocked { background-color: #991b1b; color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h1>Competitive Intelligence Agent</h1>
    <p class="subtitle">LangGraph Multi-Agent Engine with RAG and n8n Integration</p>

    <label for="query"><strong>Enter Intelligence Directive:</strong></label>
    <textarea id="query" placeholder="e.g., What are the vulnerabilities of AlphaCorp and what strategy should we adopt?"></textarea>

    <button id="submitBtn" onclick="runInvestigation()">Run Analysis</button>

    <div id="outputContainer" style="display: none; margin-top: 25px;">
        <span id="safetyBadge" class="badge"></span>
        <div id="resultText" class="output-box"></div>
    </div>
</div>

<script>
    async function runInvestigation() {
        const queryInput = document.getElementById('query');
        const submitBtn = document.getElementById('submitBtn');
        const outputContainer = document.getElementById('outputContainer');
        const resultText = document.getElementById('resultText');
        const safetyBadge = document.getElementById('safetyBadge');

        const query = queryInput.value.trim();
        if (!query) {
            alert('Please enter a valid query.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Analyzing with LangGraph Agent...';
        outputContainer.style.display = 'block';
        resultText.innerText = 'Executing graph nodes (Planner -> RAG Retrieval -> Reasoning -> Guardrails)...';

        try {
            const response = await fetch('/api/research', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();

            if (response.ok) {
                safetyBadge.innerText = data.is_safe ? 'Guardrail: Verified' : 'Guardrail: Warning';
                safetyBadge.className = data.is_safe ? 'badge badge-safe' : 'badge badge-blocked';
                resultText.innerText = data.report;
            } else {
                safetyBadge.innerText = 'Execution Failed';
                safetyBadge.className = 'badge badge-blocked';
                resultText.innerText = data.error || data.message || 'An error occurred during execution.';
            }
        } catch (error) {
            safetyBadge.innerText = 'Network Error';
            safetyBadge.className = 'badge badge-blocked';
            resultText.innerText = 'Failed to connect to API server: ' + error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Run Analysis';
        }
    }
</script>

</body>
</html>
